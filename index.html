<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Tracking System</title>
    <!-- Подключаем файл со стилями CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Единая навигационная шапка сайта -->
    <div class="top-navbar">
        <div class="logo-text">ITS</div>
        <div class="nav-actions-group">
            <button id="authBtn" class="login-btn" onclick="handleAuthAction()">Login (For Admin)</button>
            <button id="logoutBtn" class="logout-btn" onclick="triggerLogout()">Logout</button>
        </div>
    </div>

    <!-- 1. ИНТЕРФЕЙС ОБЫЧНОГО ПОЛЬЗОВАТЕЛЯ -->
    <div id="userPanel" class="interface-panel active">
        <div class="search-wrapper">
            <div class="search-box-container">
                <input type="text" id="userQueryInput" class="search-input" placeholder="Enter order ID or Customer name" onkeypress="handleSearchKeyPress(event)">
            </div>
            
            <table id="userResultsTable" style="display: none; margin-top: 40px;">
                <thead>
                    <tr>
                        <th>ORDER #</th>
                        <th>CUSTOMER</th>
                        <th>AMOUNT ($)</th>
                        <th>DELIVERY DEADLINE</th>
                        <th>DELIVERY STATUS</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- 2. АДМИН-ПАНЕЛЬ С УПРАВЛЕНИЕМ ЗАПИСЯМИ -->
    <div id="adminPanel" class="interface-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #1a202c; font-size: 22px;">Admin Management Dashboard</h2>
            <button class="login-btn" onclick="openOrderModalWindow()">+ Sales order</button>
        </div>
        
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>ORDER #</th>
                    <th>CUSTOMER</th>
                    <th>AMOUNT ($)</th>
                    <th>DELIVERY DEADLINE</th>
                    <th>DELIVERY STATUS</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Всплывающее окно добавления заказа (Modal Form) -->
    <div id="orderModalWindow" class="modal-overlay-container">
        <div class="modal-card-content">
            <h3 style="margin-top: 0; color: #1a202c; font-size: 18px; margin-bottom: 20px;">Create New Order</h3>
            <div class="input-form-group">
                <label class="form-label-text">Customer Name:</label>
                <input type="text" id="modalCustomerName" class="form-input-box" placeholder="e.g. Bulk Buyers Inc">
            </div>
            <div class="input-form-group">
                <label class="form-label-text">Purchase Amount ($):</label>
                <input type="number" step="0.01" id="modalPurchaseAmount" class="form-input-box" placeholder="0.00">
            </div>
            <div class="input-form-group">
                <label class="form-label-text">Delivery Date (YYYY-MM-DD):</label>
                <input type="date" id="modalDeliveryDate" class="form-input-box">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;">
                <button class="modal-cancel-btn" onclick="closeOrderModalWindow()">Cancel</button>
                <button class="modal-submit-btn" onclick="submitModalOrderData()">New Order</button>
            </div>
        </div>
    </div>

    <!-- Подключаем внешний JavaScript файл с логикой приложения -->
    <script src="app.js"></script>
</body>
</html>
